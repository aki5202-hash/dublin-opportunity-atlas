name: Daily liveness check

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liveness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run liveness-only refresh
        run: python scripts/refresh.py --liveness-only --skip-travel
      - name: Commit if the dataset changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add atlas_data.json changelog.json opportunities.csv feeds/ needs_review.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: daily liveness check"
            git push
          fi
